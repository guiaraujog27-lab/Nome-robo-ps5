name: Robo PS5

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */2 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  pesquisar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar bibliotecas
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4

      - name: Verificar BeautifulSoup
        run: |
          python -c "from bs4 import BeautifulSoup; print('BeautifulSoup OK')"

      - name: Executar robô
        run: |
          python robo.py

      - name: Atualizar histórico
        run: |
          python atualizar_historico.py

      - name: Salvar alterações
        run: |
          git config user.name "Robo PS5"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resultado.json historico.json
          git diff --cached --quiet || git commit -m "Atualizar preços PS5"
          git push

      - name: Preparar painel
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar painel
        uses: actions/deploy-pages@v4