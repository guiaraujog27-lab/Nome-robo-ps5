<!DOCTYPE html>
<html lang="pt-BR">alert("JAVASCRIPT FUNCIONANDO");
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Robô PS5</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    margin: 0;
    padding: 20px;
    color: #111827;
}

.container {
    max-width: 700px;
    margin: auto;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 18px;
    margin-bottom: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,.08);
}

h1 {
    margin-top: 0;
}

.preco {
    font-size: 40px;
    font-weight: bold;
}

.verde {
    color: #16a34a;
}

.vermelho {
    color: #dc2626;
}

button {
    padding: 12px 18px;
    border: none;
    border-radius: 10px;
    background: #111827;
    color: white;
    font-size: 16px;
}

.erro {
    background: #fee2e2;
    color: #991b1b;
    padding: 15px;
    border-radius: 10px;
    word-break: break-word;
}

table {
    width: 100%;
    border-collapse: collapse;
}

td, th {
    padding: 10px;
    border-bottom: 1px solid #ddd;
    text-align: left;
}
</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>🎮 Robô de Preços PS5</h1>

<p>Monitoramento automático • V6.2</p>

</div>

<div id="status" class="card">

⏳ Testando conexão com resultado.json...

</div>

<div id="painel" style="display:none;">

<div class="card">

<h2 id="produto"></h2>

<p>🏆 Menor preço encontrado</p>

<div id="preco" class="preco"></div>

<p id="loja"></p>

<p id="atualizado"></p>

<a id="link"
   target="_blank"
   style="display:none;">

🛒 Ver oferta

</a>

</div>

<div class="card">

<h2>🏪 Lojas</h2>

<table>

<thead>

<tr>
<th>Loja</th>
<th>Preço</th>
<th>Status</th>
</tr>

</thead>

<tbody id="lojas"></tbody>

</table>

</div>

<div class="card">

<h2>🎯 Limite</h2>

<p id="limite"></p>

<p id="oferta"></p>

</div>

</div>

</div>


<script>

async function iniciar() {

    const status =
        document.getElementById("status");

    try {

        status.innerHTML =
            "⏳ Conectando ao resultado.json...";


        const url =
            "./resultado.json?t=" +
            Date.now();


        console.log(
            "Tentando carregar:",
            url
        );


        const resposta =
            await fetch(url);


        console.log(
            "Status HTTP:",
            resposta.status
        );


        if (!resposta.ok) {

            throw new Error(
                "HTTP " +
                resposta.status +
                " ao acessar resultado.json"
            );

        }


        const texto =
            await resposta.text();


        console.log(
            "JSON recebido:",
            texto
        );


        let dados;


        try {

            dados =
                JSON.parse(texto);

        } catch (erroJSON) {

            throw new Error(
                "resultado.json não é um JSON válido. " +
                erroJSON.message
            );

        }


        console.log(
            "Dados:",
            dados
        );


        mostrar(dados);


        status.style.display =
            "none";


        document.getElementById(
            "painel"
        ).style.display =
            "block";


    } catch (erro) {

        console.error(
            erro
        );


        status.innerHTML = `

            <div class="erro">

                ❌ ERRO NO PAINEL

                <br><br>

                <strong>
                    ${erro.message}
                </strong>

                <br><br>

                Arquivo testado:

                <br>

                ./resultado.json

            </div>

        `;

    }

}


function dinheiro(valor) {

    return Number(valor).toLocaleString(
        "pt-BR",
        {
            style: "currency",
            currency: "BRL"
        }
    );

}


function mostrar(dados) {

    document.getElementById(
        "produto"
    ).textContent =
        dados.produto ||
        "PS5 Slim Digital 1TB";


    const limite =
        Number(
            dados.preco_maximo ||
            3500
        );


    let ofertas =
        Array.isArray(dados.ofertas)
        ? dados.ofertas
        : [];


    let validas =
        ofertas.filter(
            item =>
                item.preco !== undefined &&
                item.preco !== null
        );


    validas.sort(
        (a,b) =>
            Number(a.preco) -
            Number(b.preco)
    );


    const menor =
        dados.menor_preco !== undefined
        ? Number(dados.menor_preco)
        : (
            validas.length
            ? Number(validas[0].preco)
            : null
        );


    const preco =
        document.getElementById(
            "preco"
        );


    if (menor !== null) {

        preco.textContent =
            dinheiro(menor);


        preco.className =
            "preco " +
            (
                menor <= limite
                ? "verde"
                : "vermelho"
            );

    } else {

        preco.textContent =
            "Não encontrado";

    }


    if (validas.length) {

        const primeira =
            validas[0];


        document.getElementById(
            "loja"
        ).textContent =
            "🏪 " +
            primeira.loja;


        const link =
            document.getElementById(
                "link"
            );


        if (primeira.url) {

            link.href =
                primeira.url;

            link.style.display =
                "inline-block";

        }

    }


    document.getElementById(
        "limite"
    ).textContent =
        dinheiro(limite);


    document.getElementById(
        "oferta"
    ).textContent =
        menor !== null &&
        menor <= limite
        ? "🔥 OFERTA ENCONTRADA!"
        : "Preço acima do limite";


    document.getElementById(
        "atualizado"
    ).textContent =
        "🕐 Atualizado: " +
        (
            dados.atualizado ||
            "-"
        );


    const tabela =
        document.getElementById(
            "lojas"
        );


    tabela.innerHTML = "";


    ofertas.forEach(
        item => {

            const tr =
                document.createElement(
                    "tr"
                );


            let preco =
                item.preco !== undefined
                ? dinheiro(item.preco)
                : "—";


            let status =
                item.status === "bloqueada"
                ? "🚫 Bloqueada"
                : (
                    item.preco <= limite
                    ? "🔥 Oferta"
                    : "Normal"
                );


            tr.innerHTML = `

                <td>
                    ${item.loja || "-"}
                </td>

                <td>
                    ${preco}
                </td>

                <td>
                    ${status}
                </td>

            `;


            tabela.appendChild(tr);

        }
    );

}


iniciar();

</script>

</body>
</html>
